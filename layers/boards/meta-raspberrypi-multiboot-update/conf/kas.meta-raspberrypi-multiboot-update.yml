header:
  version: 1

machine: raspberrypi3-multiboot

repos:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi"

  emx-base-stack:
    layers:
      layers/boards/meta-raspberrypi-multiboot-update:

local_conf_header:
  meta-raspberrypi-multiboot-update: |
    # Enable license for linux-firmware-rpidistro
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"